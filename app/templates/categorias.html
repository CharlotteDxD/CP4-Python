{% extends "base.html" %}
{% block title %}Categorias{% endblock %}

{% block content %}
<div class="page">
  <header class="page-head">
    <div>
      <h1 class="page-title">Categorias</h1>
      <p class="page-sub">O agente usa esta lista para categorizar as transações registradas sem categoria.</p>
    </div>
  </header>

  <section class="block">
    <form class="cat-form" id="form-cat" novalidate>
      <div class="field" id="campo-nome">
        <label for="c-nome">Nova categoria</label>
        <input class="input" id="c-nome" name="nome" autocomplete="off" placeholder="Ex.: Manutenção">
        <p class="field-error" hidden></p>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-criar">Criar categoria</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Categoria</th><th class="num">Transações</th><th class="num">Total movimentado</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/categorias.js') }}"></script>
{% endblock %}

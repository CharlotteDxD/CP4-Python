{% extends "base.html" %}
{% block title %}Categorias{% endblock %}

{% block content %}
<div class="page">
  <header class="page-head">
    <div>
      <h1 class="page-title">Categorias</h1>
      <p class="page-sub">O agente usa esta lista para categorizar as transações registradas sem categoria.</p>
    </div>
  </header>

  <section class="block">
    <form class="cat-form" id="form-cat" novalidate>
      <div class="field" id="campo-nome">
        <label for="c-nome">Nova categoria</label>
        <input class="input" id="c-nome" name="nome" autocomplete="off" maxlength="80" aria-describedby="c-nome-erro" placeholder="Ex.: Manutenção">
        <p class="field-error" id="c-nome-erro" role="alert" hidden></p>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-criar">Criar categoria</button>
    </form>
    <div class="form-error inline-alert" id="aviso" role="alert" hidden>
      <span id="aviso-texto"></span>
      <button type="button" class="btn" data-tentar>Tentar de novo</button>
    </div>
    <div class="table-wrap">
      <table class="stack-sm">
        <thead><tr><th>Categoria</th><th class="num">Transações</th><th class="num">Total movimentado</th><th><span class="vh">Ações</span></th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </section>
</div>

<dialog id="dlg-renomear" aria-labelledby="dlg-renomear-titulo">
  <form class="dialog-form" id="form-renomear" novalidate>
    <h2 class="dialog-title" id="dlg-renomear-titulo">Renomear categoria</h2>
    <p class="form-error" id="ren-erro" role="alert" hidden></p>
    <div class="field">
      <label for="r-nome">Nome</label>
      <input class="input" id="r-nome" name="nome" autocomplete="off" maxlength="80">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-fechar>Cancelar</button>
      <button type="submit" class="btn btn-primary" id="btn-renomear">Salvar</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/categorias.js') }}"></script>
{% endblock %}
